var Render = {};

/* 统一空状态：一个漂浮的小装饰 + 一句软软的话 */
Render.empty = function(icon, text, style) {
  return '<div class="empty-state"'+(style?' style="'+style+'"':'')+'>' +
    '<span class="es-deco">'+Icon(icon||'cloud')+'</span>'+Util.esc(text)+'</div>';
};

Render.countdownText = function(dateISO, timeHM) {
  var targetDate = Util.parseISO(dateISO);
  var timeParts = timeHM.split(':');
  targetDate.setHours(parseInt(timeParts[0]), parseInt(timeParts[1]), 0);
  var diff = targetDate - new Date();
  if (diff <= 0) return '正在进行中';
  var days = Math.floor(diff/86400000);
  var hrs = Math.floor((diff%86400000)/3600000);
  var mins = Math.floor((diff%3600000)/60000);
  return '还有 '+days+' 天 '+String(hrs).padStart(2,'0')+':'+String(mins).padStart(2,'0');
};

Render.home = function(data) {
  var nowISO = Util.today();
  var nowHM = Util.nowHM();
  var week = Util.weekOf(nowISO);
  var isHoliday = !week;
  var progress = week ? Math.round(week / CONST.TOTAL_WEEKS * 100) : 0;

  var todayCourses = Schedule.todayCourses(data.courses, nowISO, nowHM);
  var nextUp = Schedule.nextUp(data.courses, data.events, nowISO, nowHM);
  var todayEvents = data.events.filter(function(e){ return e.date === nowISO; });
  var todayStats = Events.stats(todayEvents);

  var coursesHTML = todayCourses.length ? todayCourses.map(function(b) {
    var cls = b.state === 'past' ? 'is-past' : (b.state === 'ongoing' ? 'is-ongoing' : '');
    var st = b.state === 'ongoing' ? 'ongoing' : (b.state === 'past' ? 'past' : 'idle');
    var stLabel = b.state === 'ongoing' ? '进行中' : (b.state === 'past' ? '已结束' : '未开始');
    return '<div class="course-row '+cls+'" data-course="'+b.courseId+'" style="border-left-color:'+Util.esc(b.course.color)+'">' +
      '<span class="cr-time">'+Util.periodTime(b.periodStart, b.periodEnd)+'</span>' +
      '<span class="cr-name">'+Util.esc(b.course.name)+'</span>' +
      '<span class="cr-meta">'+Util.esc(b.course.teacher)+' · '+Util.esc(b.location)+'</span>' +
      '<span class="cr-status '+st+'">'+stLabel+'</span>' +
    '</div>';
  }).join('') : Render.empty('cloud', '今天没有课，好好安排一下');

  var nextHTML = nextUp ?
    '<div class="nc-title">'+Util.esc(nextUp.title)+'</div>' +
    '<div class="nc-time">'+Util.esc(nextUp.date)+' · '+Util.esc(nextUp.time)+(nextUp.location?' · '+Util.esc(nextUp.location):'')+'</div>' +
    '<div class="nc-countdown" id="countdown">'+Render.countdownText(nextUp.date, nextUp.time)+'</div>' +
    '<div class="nc-link" data-goto="table">去课表 '+Icon('right')+'</div>' :
    Render.empty('sparkle', '暂无安排', 'padding:16px;');

  var todosHTML = todayEvents.length ? todayEvents.map(function(ev) {
    var cat = CONST.CATEGORIES[ev.category] || CONST.CATEGORIES.personal;
    return '<div class="todo-row" data-event="'+ev.id+'">' +
      '<span class="todo-check'+(ev.done?' done':'')+'" data-toggle="'+ev.id+'">'+Icon('check')+'</span>' +
      '<span class="todo-title'+(ev.done?' done':'')+'">'+Util.esc(ev.title)+'</span>' +
      '<span class="todo-time">'+(ev.startTime||'全天')+'</span>' +
      '<span class="todo-cat" style="background:'+cat.bg+';color:'+cat.ink+'">'+cat.label+'</span>' +
    '</div>';
  }).join('') : Render.empty('flower', '今天没有待办', 'padding:16px;');

  var greeting = (function() {
    var h = parseInt(nowHM.split(':')[0], 10);
    if (h < 6)  return '夜深啦，早点休息';
    if (h < 11) return '早上好呀';
    if (h < 14) return '中午好呀';
    if (h < 18) return '下午好呀';
    return '晚上好呀';
  })();

  return '<div class="hm-banner">' +
    '<span class="hm-deco d1">'+Icon('bow')+'</span>' +
    '<span class="hm-deco d2">'+Icon('heart')+'</span>' +
    '<span class="hm-deco d3">'+Icon('sparkle')+'</span>' +
    '<div class="hm-date">'+Util.fmtCN(nowISO)+'</div>' +
    '<div class="hm-week">'+greeting+' · '+(isHoliday ? '假期 / 非教学周' : '第 '+week+' 周 / 共 '+CONST.TOTAL_WEEKS+' 周')+'</div>' +
    '<div class="hm-progress"><div class="hm-progress-bar"><div class="hm-progress-fill" style="width:'+progress+'%"></div></div><div class="hm-progress-text">学期进度 '+progress+'%</div></div>' +
    '</div>' +
    '<div class="hm-cols">' +
    '<div><div class="card"><div class="card-title">今日课程 <span class="count">('+todayCourses.length+')</span></div>'+coursesHTML+'</div></div>' +
    '<div>' +
    '<div class="card next-card"><div class="card-title">下一个安排</div>'+nextHTML+'</div>' +
    '<div class="card"><div class="card-title">今日待办 <span class="count">(已完成 '+todayStats.done+' / '+todayStats.total+')</span></div>'+todosHTML+'<div style="text-align:center;margin-top:12px;"><button class="btn btn-ghost btn-sm" id="hm-add-todo">'+Icon('plus')+'添加待办</button></div></div>' +
    '</div></div>';
};

Render.timetable = function(data) {
  var nowISO = Util.today();
  var nowHM = Util.nowHM();
  var week = App.state.week || Util.weekOf(nowISO) || 1;
  if (week < 1) week = 1;
  if (week > CONST.TOTAL_WEEKS) week = CONST.TOTAL_WEEKS;
  App.state.week = week;

  var weekStartISO = Util.dateOf(week, 1);
  var weekEndISO = Util.dateOf(week, 7);
  var blocks = Schedule.courseBlocksForWeek(data.courses, week);
  var noTime = Schedule.noTimeCourses(data.courses);
  var todayWD = Util.weekdayOf(nowISO);
  var currentWeek = Util.weekOf(nowISO) === week;

  var noTimeHTML = noTime.length ? '<div class="tt-fixed-strip">'+Icon('bell')+'<span>无固定时间课程：'+noTime.map(function(c){ return Util.esc(c.name)+' · '+Util.esc(c.teacher)+' · '+Util.esc(c.mode); }).join('；')+'</span></div>' : '';

  // Desktop grid
  var gridHTML = '<div class="tt-grid">';
  // Header row
  gridHTML += '<div class="tt-axis-cell"></div>';
  for (var d = 1; d <= 7; d++) {
    var dateISO = Util.dateOf(week, d);
    gridHTML += '<div class="tt-day-head'+(d===todayWD&&currentWeek?' is-today':'')+'" data-date="'+dateISO+'"><span>'+CONST.WEEKDAY_LABELS[d-1]+'</span><span class="dh-num">'+(parseInt(dateISO.split('-')[2]))+'</span></div>';
  }
  // Period rows
  for (var p = 1; p <= 14; p++) {
    var timeLabel = (p===1||p===6||p===11) ? CONST.PERIODS[p][0] : '';
    gridHTML += '<div class="tt-axis-cell">'+(timeLabel?p+'<br><span style="font-size:0.6rem;">'+timeLabel+'</span>':p)+'</div>';
    for (var d = 1; d <= 7; d++) {
      gridHTML += '<div class="tt-cell" data-date="'+Util.dateOf(week,d)+'" data-period="'+p+'"><span class="cell-plus">'+Icon('plus')+'</span></div>';
    }
  }
  // Course blocks
  blocks.forEach(function(b) {
    var top = b.periodStart * 46;
    var height = (b.periodEnd - b.periodStart + 1) * 46 - 6;
    var leftPos = 56 + (b.weekday - 1) * 100 + 2;
    gridHTML += '<div class="tt-block" style="top:'+top+'px;height:'+height+'px;left:'+leftPos+'px;width:96px;background:'+Util.esc(b.course.color)+';" data-course="'+b.courseId+'" data-block-weekstart="'+b.weekStart+'" data-block-weekend="'+b.weekEnd+'" data-block-weekday="'+b.weekday+'" data-block-ps="'+b.periodStart+'" data-block-pe="'+b.periodEnd+'">' +
      '<div class="blk-name">'+Util.esc(b.course.name)+'</div>' +
      '<div class="blk-loc">'+Util.esc(b.location)+'</div>' +
    '</div>';
  });
  // Now line
  if (currentWeek) {
    var nowPeriod = 0;
    for (var p = 1; p <= 14; p++) {
      if (nowHM >= CONST.PERIODS[p][0] && nowHM <= CONST.PERIODS[p][1]) { nowPeriod = p; break; }
      if (nowHM < CONST.PERIODS[p][0]) { nowPeriod = p - 0.5; break; }
    }
    if (nowPeriod > 0) {
      var lineTop = nowPeriod * 46 + ((nowHM - CONST.PERIODS[Math.max(1,Math.floor(nowPeriod))][0]) / 45) * 46;
      gridHTML += '<div class="tt-nowline" style="top:'+Math.max(0,lineTop)+'px;"></div>';
    }
  }
  gridHTML += '</div>';

  // Mobile day view
  var mobileDate = App.state.mobileDate || nowISO;
  var mobileWD = Util.weekdayOf(mobileDate);
  var dayBlocks = Schedule.blocksOnDate(blocks, mobileDate).sort(function(a,b){ return a.periodStart-b.periodStart; });

  var daybarHTML = '<div class="tt-daybar">';
  for (var d = 1; d <= 7; d++) {
    var dateISO = Util.dateOf(week, d);
    var hasCourses = blocks.some(function(b){ return b.weekday === d; });
    daybarHTML += '<div class="day-chip'+(dateISO===mobileDate?' active':'')+'" data-mobile-date="'+dateISO+'">' +
      '<span>'+CONST.WEEKDAY_LABELS[d-1].slice(1)+'</span>' +
      '<span class="dc-num">'+(parseInt(dateISO.split('-')[2]))+'</span>' +
      (hasCourses?'<span class="has-dot"></span>':'') +
    '</div>';
  }
  daybarHTML += '</div>';

  var daylistHTML = '<div class="tt-daylist">';
  var lastEnd = 0;
  dayBlocks.forEach(function(b) {
    if (b.periodStart > lastEnd + 1) {
      for (var fp = lastEnd + 1; fp < b.periodStart; fp++) {
        daylistHTML += '<div class="tl-freerow"><span>'+CONST.PERIODS[fp][0]+' 空闲</span><span class="free-plus" data-free-date="'+mobileDate+'" data-free-period="'+fp+'">'+Icon('plus')+'</span></div>';
      }
    }
    daylistHTML += '<div class="tl-row"><div class="tl-bar" style="background:'+Util.esc(b.course.color)+';height:'+(b.periodEnd-b.periodStart+1)*40+'px;"></div><div class="tl-time">'+Util.periodTime(b.periodStart,b.periodEnd)+'</div><div class="tl-body"><div class="tl-name">'+Util.esc(b.course.name)+'</div><div class="tl-meta">'+Util.esc(b.location)+(b.course.teacher?' · '+Util.esc(b.course.teacher):'')+'</div></div></div>';
    lastEnd = b.periodEnd;
  });
  if (lastEnd < 14) {
    for (var fp = lastEnd + 1; fp <= 14; fp++) {
      daylistHTML += '<div class="tl-freerow"><span>'+CONST.PERIODS[fp][0]+' 空闲</span><span class="free-plus" data-free-date="'+mobileDate+'" data-free-period="'+fp+'">'+Icon('plus')+'</span></div>';
    }
  }
  if (dayBlocks.length === 0) {
    daylistHTML += Render.empty('star', '这天没有课');
  }
  daylistHTML += '</div>';

  return noTimeHTML +
    '<div class="tt-toolbar">' +
    '<button class="btn btn-ghost btn-sm" id="tt-prev"'+(week<=1?' disabled':'')+'>'+Icon('left')+'上一周</button>' +
    '<span class="tt-week-title">第 '+week+' 周 ('+Util.fmtCN(weekStartISO)+' ~ '+Util.fmtCN(weekEndISO)+')</span>' +
    '<button class="btn btn-ghost btn-sm" id="tt-today">'+Icon('sun')+'回到本周</button>' +
    '<button class="btn btn-ghost btn-sm" id="tt-next"'+(week>=CONST.TOTAL_WEEKS?' disabled':'')+'>下一周'+Icon('right')+'</button>' +
    '</div>' +
    '<div class="tt-grid-wrap">'+gridHTML+'</div>' +
    '<div class="tt-mobile">'+daybarHTML+daylistHTML+'</div>';
};

Render.agenda = function(data) {
  var nowISO = Util.today();
  var filter = App.state.agendaFilter || 'today';
  var filtered = Events.filterBy(data.events, filter, nowISO);
  var sorted = Events.sort(filtered);
  var groups = Events.groupByDate(sorted, nowISO);

  var filtersHTML = ['today','week','all','done'].map(function(k) {
    var labels = {today:'今天',week:'本周',all:'全部',done:'已完成'};
    return '<button class="chip'+(filter===k?' active':'')+'" data-filter="'+k+'">'+labels[k]+'</button>';
  }).join('');

  var itemsHTML = '';
  if (groups.length === 0) {
    itemsHTML = '<div class="empty-state"><span class="es-deco">'+Icon('flower')+'</span>这个范围还没有安排<br><button class="btn btn-primary btn-sm" style="margin-top:14px;" id="ag-empty-new">'+Icon('plus')+'去新建</button></div>';
  } else {
    groups.forEach(function(g) {
      itemsHTML += '<div class="ag-group-head">'+Icon('star')+Util.esc(g.title)+'<span class="gh-count">('+g.items.length+')</span></div>';
      g.items.forEach(function(ev) {
        var cat = CONST.CATEGORIES[ev.category] || CONST.CATEGORIES.personal;
        var overdue = Events.isOverdue(ev, nowISO);
        itemsHTML += '<div class="ag-item" data-event="'+ev.id+'">' +
          '<span class="ag-check'+(ev.done?' done':'')+'" data-toggle="'+ev.id+'">'+Icon('check')+'</span>' +
          '<div class="ag-body">' +
          '<div class="ag-title'+(ev.done?' done':'')+'">'+Util.esc(ev.title)+'</div>' +
          '<div class="ag-meta'+(overdue?' overdue':'')+'">'+(ev.startTime?(ev.endTime?ev.startTime+'-'+ev.endTime:ev.startTime):'全天')+(ev.location?' · '+Util.esc(ev.location):'')+(overdue?' · 已逾期':'')+'</div>' +
          '</div>' +
          '<span class="ag-cat" style="background:'+cat.bg+';color:'+cat.ink+'">'+cat.label+'</span>' +
        '</div>';
      });
    });
  }

  return '<div class="ag-toolbar">' +
    '<div class="ag-filters">'+filtersHTML+'</div>' +
    '<button class="btn btn-primary btn-sm btn-new-desktop" id="ag-new">'+Icon('plus')+'新建日程</button>' +
    '</div>' +
    itemsHTML;
};

/* ============================================================
   APP
   ============================================================ */
var App = {};
App.state = { view: 'home', week: null, agendaFilter: 'today', mobileDate: null };
App.data = null;
App._ticker = null;

App.init = function() {
  Icon.hydrate(document);
  App.data = Store.load();
  App.state.week = Util.weekOf(Util.today()) || 1;
  App.state.mobileDate = Util.today();
  App.bindEvents();
  App.render();
  App.startTicker();

  // Self-test
  if (location.search.indexOf('selftest=1') !== -1) {
    SelfTest.run();
  }
};

App.setView = function(view) {
  App.state.view = view;
  document.querySelectorAll('#tabs .tab, #tabbar .tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.view === view);
  });
  document.getElementById('view-home').style.display = view==='home'?'':'none';
  document.getElementById('view-table').style.display = view==='table'?'':'none';
  document.getElementById('view-agenda').style.display = view==='agenda'?'':'none';
  App.render();
  if (view === 'home') App.startTicker(); else App.stopTicker();
};

App.render = function() {
  var data = App.data;
  var week = Util.weekOf(Util.today());
  var badge = document.getElementById('weekBadge');
  var badgeText = document.getElementById('weekBadgeText');
  if (week) {
    badgeText.textContent = '第'+week+'周';
    badge.className = 'week-badge';
  } else {
    badgeText.textContent = '假期';
    badge.className = 'week-badge is-holiday';
  }

  document.getElementById('view-home').innerHTML = Render.home(data);
  document.getElementById('view-table').innerHTML = Render.timetable(data);
  document.getElementById('view-agenda').innerHTML = Render.agenda(data);
};

App.startTicker = function() {
  App.stopTicker();
  App._ticker = setInterval(function() {
    if (App.state.view === 'home') {
      var el = document.getElementById('countdown');
      if (el) {
        var nowISO = Util.today();
        var nowHM = Util.nowHM();
        var next = Schedule.nextUp(App.data.courses, App.data.events, nowISO, nowHM);
        if (next) {
          el.textContent = Render.countdownText(next.date, next.time);
        }
      }
    }
  }, 60000);
};

App.stopTicker = function() { if (App._ticker) { clearInterval(App._ticker); App._ticker = null; } };

App.bindEvents = function() {
  // Tab navigation
  document.querySelectorAll('[data-view]').forEach(function(tab) {
    tab.addEventListener('click', function() { App.setView(tab.dataset.view); });
  });

  // Backup button
  document.getElementById('btnBackup').addEventListener('click', function() { Backup.open(App.data); });

  // FAB
  document.getElementById('fab').addEventListener('click', function() { Form.openEvent(App.data, {mode:'create'}); });

  // Delegated clicks on #view
  document.getElementById('view').addEventListener('click', function(e) {
    var target = e.target;

    // Home: course row -> go to timetable
    var courseRow = target.closest('.course-row');
    if (courseRow) { App.setView('table'); return; }

    // Home: todo toggle
    var todoCheck = target.closest('[data-toggle]');
    if (todoCheck && todoCheck.classList.contains('todo-check')) {
      Events.toggle(App.data, todoCheck.dataset.toggle);
      Toast.show(todoCheck.classList.contains('done') ? '已恢复' : '已完成');
      App.render();
      return;
    }

    // Home: add todo
    if (target.id === 'hm-add-todo') { Form.openEvent(App.data, {mode:'create', preset:{date:Util.today(), category:'personal'}}); return; }

    // Home: go to table link
    if (target.dataset && target.dataset.goto === 'table') { App.setView('table'); return; }

    // Timetable: prev/next/today
    if (target.id === 'tt-prev') { App.state.week = Math.max(1, App.state.week-1); App.render(); return; }
    if (target.id === 'tt-next') { App.state.week = Math.min(CONST.TOTAL_WEEKS, App.state.week+1); App.render(); return; }
    if (target.id === 'tt-today') { App.state.week = Util.weekOf(Util.today())||1; App.state.mobileDate = Util.today(); App.render(); return; }

    // Timetable: mobile day chip
    var dayChip = target.closest('.day-chip');
    if (dayChip && dayChip.dataset.mobileDate) { App.state.mobileDate = dayChip.dataset.mobileDate; App.render(); return; }

    // Timetable: cell click (desktop)
    var cell = target.closest('.tt-cell');
    if (cell && cell.dataset.date) {
      var p = parseInt(cell.dataset.period);
      var ps = p, pe = p;
      Form.openEvent(App.data, {mode:'create', preset:{date:cell.dataset.date, startTime:CONST.PERIODS[ps][0], endTime:CONST.PERIODS[pe][1]}});
      return;
    }

    // Timetable: free row plus (mobile)
    var freePlus = target.closest('.free-plus');
    if (freePlus) {
      var fp = parseInt(freePlus.dataset.freePeriod);
      Form.openEvent(App.data, {mode:'create', preset:{date:freePlus.dataset.freeDate, startTime:CONST.PERIODS[fp][0], endTime:CONST.PERIODS[fp][1]}});
      return;
    }

    // Timetable: block click
    var block = target.closest('.tt-block');
    if (block) { Form.openCourseDetail(App.data, block.dataset.course); return; }

    // Agenda: filter
    var filterChip = target.closest('[data-filter]');
    if (filterChip) { App.state.agendaFilter = filterChip.dataset.filter; App.render(); return; }

    // Agenda: toggle
    var agCheck = target.closest('[data-toggle]');
    if (agCheck && agCheck.classList.contains('ag-check')) {
      Events.toggle(App.data, agCheck.dataset.toggle);
      Toast.show(agCheck.classList.contains('done') ? '已恢复' : '已完成');
      App.render();
      return;
    }

    // Agenda: item click -> edit
    var agItem = target.closest('.ag-item');
    if (agItem && !target.classList.contains('ag-check')) {
      Form.openEvent(App.data, {mode:'edit', id:agItem.dataset.event});
      return;
    }

    // Agenda: new button
    if (target.id === 'ag-new' || target.id === 'ag-empty-new') { Form.openEvent(App.data, {mode:'create'}); return; }
  });

  // Modal overlay click
  document.getElementById('modalRoot').addEventListener('click', function(e) {
    if (e.target.classList.contains('modal-overlay')) Modal.close();
  });

  // Keyboard
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { if (Modal.stack.length) Modal.close(); return; }
    if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
    if (App.state.view === 'table') {
      if (e.key === 'ArrowLeft') { App.state.week = Math.max(1, App.state.week-1); App.render(); }
      if (e.key === 'ArrowRight') { App.state.week = Math.min(CONST.TOTAL_WEEKS, App.state.week+1); App.render(); }
    }
    if (App.state.view === 'agenda' && e.key === 'n') { Form.openEvent(App.data, {mode:'create'}); }
  });
};

/* ============================================================
   SELF TEST
   ============================================================ */
var SelfTest = {};
SelfTest.pass = 0;
SelfTest.fail = 0;

SelfTest.assert = function(name, actual, expected) {
  var ok = JSON.stringify(actual) === JSON.stringify(expected);
  if (ok) { SelfTest.pass++; console.log('  ✓ '+name); }
  else { SelfTest.fail++; console.error('  ✗ '+name+' | expected: '+JSON.stringify(expected)+' | actual: '+JSON.stringify(actual)); }
};

SelfTest.run = function() {
  console.log('=== Self Test ===');
  SelfTest.pass = 0; SelfTest.fail = 0;

  // DateUtil
  SelfTest.assert('parseISO 2026-09-07', Util.parseISO('2026-09-07').getDate(), 7);
  SelfTest.assert('weekOf 09-07 -> 1', Util.weekOf('2026-09-07'), 1);
  SelfTest.assert('weekOf 09-23 -> 3', Util.weekOf('2026-09-23'), 3);
  SelfTest.assert('weekOf 10-12 -> 6', Util.weekOf('2026-10-12'), 6);
  SelfTest.assert('weekOf 01-17 -> 19', Util.weekOf('2027-01-17'), 19);
  SelfTest.assert('weekOf 2027-03-01 -> null', Util.weekOf('2027-03-01'), null);
  SelfTest.assert('weekdayOf 09-23 (Wed) -> 3', Util.weekdayOf('2026-09-23'), 3);
  SelfTest.assert('periodTime 2,5', Util.periodTime(2,5), '08:50-12:15');
  SelfTest.assert('periodTime 8,9', Util.periodTime(8,9), '15:50-17:25');
  SelfTest.assert('dateOf week1 mon', Util.dateOf(1,1), '2026-09-07');
  SelfTest.assert('dateOf week6 mon', Util.dateOf(6,1), '2026-10-12');

  // Schedule
  var courses = CONST.SEED_COURSES;
  var w1 = Schedule.courseBlocksForWeek(courses, 1);
  SelfTest.assert('week1 blocks count', w1.length, 2);
  SelfTest.assert('week1 has 可靠性', w1.some(function(b){return b.courseId==='c1';}), true);
  SelfTest.assert('week1 has 学术写作', w1.some(function(b){return b.courseId==='c3';}), true);
  SelfTest.assert('week1 no 物流运输', w1.some(function(b){return b.courseId==='c4';}), false);

  var w6 = Schedule.courseBlocksForWeek(courses, 6);
  var mon6 = w6.filter(function(b){return b.weekday===1;});
  SelfTest.assert('week6 mon blocks', mon6.length, 3);

  var w11 = Schedule.courseBlocksForWeek(courses, 11);
  var mon11 = w11.filter(function(b){return b.weekday===1;});
  SelfTest.assert('week11 mon blocks (only 8-9)', mon11.length, 1);
  SelfTest.assert('week11 mon period range', mon11[0].periodStart+'-'+mon11[0].periodEnd, '8-9');

  var w10 = Schedule.courseBlocksForWeek(courses, 10);
  SelfTest.assert('week10 no 可靠性', w10.some(function(b){return b.courseId==='c1';}), false);

  var w9 = Schedule.courseBlocksForWeek(courses, 9);
  SelfTest.assert('week9 has 可靠性', w9.some(function(b){return b.courseId==='c1';}), true);

  var noTime = Schedule.noTimeCourses(courses);
  SelfTest.assert('noTimeCourses count', noTime.length, 1);
  SelfTest.assert('noTimeCourses is AI安全', noTime[0].id, 'c2');

  var blocks0911 = Schedule.blocksOnDate(w1, '2026-09-11');
  SelfTest.assert('09-11 blocks (Fri week1)', blocks0911.length, 1);
  SelfTest.assert('09-11 is 学术写作', blocks0911[0].courseId, 'c3');

  // Block positioning
  var c1Block = w1.find(function(b){return b.courseId==='c1';});
  var expectedLeft = 56 + (1-1)*100 + 2; // Monday = weekday 1
  var expectedTop = 1 * 46; // periodStart=1, offset by header row (46px)
  SelfTest.assert('c1 block left position', expectedLeft, 58);
  SelfTest.assert('c1 block top position', expectedTop, 46);
  SelfTest.assert('c1 block width', 96, 96);

  // Events
  var testData = { courses: courses, events: [], settings: {} };
  var ev1 = Events.create(testData, {title:'测试', date:'2026-09-23', category:'homework'});
  SelfTest.assert('create event id', typeof ev1.id, 'string');
  SelfTest.assert('events count', testData.events.length, 1);
  Events.toggle(testData, ev1.id);
  SelfTest.assert('toggle done', testData.events[0].done, true);
  Events.remove(testData, ev1.id);
  SelfTest.assert('remove event', testData.events.length, 0);

  var evs = [
    {id:'e1',title:'A',date:'2026-09-23',startTime:'14:00',category:'homework',done:false},
    {id:'e2',title:'B',date:'2026-09-23',category:'personal',done:false},
    {id:'e3',title:'C',date:'2026-09-20',category:'meeting',done:false}
  ];
  var sorted = Events.sort(evs);
  SelfTest.assert('sort: timed before all-day', sorted[0].id, 'e1');
  SelfTest.assert('sort: date order', sorted[2].id, 'e3');

  var overdue = Events.isOverdue({date:'2026-09-20',done:false}, '2026-09-23');
  SelfTest.assert('isOverdue', overdue, true);

  var filtered = Events.filterBy(evs, 'today', '2026-09-23');
  SelfTest.assert('filter today', filtered.length, 2);
  var filteredWeek = Events.filterBy(evs, 'week', '2026-09-23');
  SelfTest.assert('filter week', filteredWeek.length, 2);

  // Render countdown
  var futureText = Render.countdownText('2026-09-25', '08:50');
  SelfTest.assert('countdown future starts with 还有', futureText.indexOf('还有'), 0);
  var pastText = Render.countdownText('2020-01-01', '00:00');
  SelfTest.assert('countdown past shows 正在进行中', pastText, '正在进行中');

  // Store
  SelfTest.assert('validate good', Store.validate({courses:[{name:'X',slots:[]}],events:[]}).length, 0);
  SelfTest.assert('validate bad', Store.validate({}).length > 0, true);

  console.log('=== Results: '+SelfTest.pass+' passed, '+SelfTest.fail+' failed ===');
};
