<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的日程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Quicksand:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   KAWAII / SANRIO DESIGN TOKENS
   ============================================================ */
:root {
  /* brand palette */
  --c-pink:        #FFB7C5;   /* 樱花粉 */
  --c-pink-soft:   #FFD5DF;
  --c-pink-wash:   #FFF1F5;
  --c-pink-deep:   #D96C83;   /* 深粉 */
  --c-mint:        #BEE7D8;   /* 薄荷奶绿 */
  --c-mint-deep:   #5FA98C;
  --c-mint-wash:   #EFFAF5;
  --c-sky:         #BFDFFF;   /* 天空蓝 */
  --c-sky-wash:    #F0F7FF;
  --c-lemon:       #FFE9A8;   /* 柠檬奶油 */
  --c-lemon-wash:  #FFFAEC;
  --c-strawberry:  #F4707F;   /* 草莓红 */
  --c-straw-wash:  #FFEEF1;

  /* surface & ink — 无纯黑 */
  --c-bg:      #FFF9F5;       /* 奶油白 */
  --c-card:    #FFFFFF;
  --c-ink:     #6B4F3A;       /* 暖棕 */
  --c-ink-2:   rgba(107, 79, 58, 0.74);
  --c-ink-3:   rgba(107, 79, 58, 0.54);
  --c-line:    rgba(107, 79, 58, 0.13);

  /* 旧变量别名（内联样式仍引用） */
  --c-primary:       #FFB7C5;
  --c-primary-ink:   #D96C83;
  --c-primary-weak:  #FFF1F5;
  --c-accent-yellow: #FFE9A8;
  --c-accent-green:  #BEE7D8;
  --c-text:   var(--c-ink);
  --c-text-2: var(--c-ink-2);
  --c-text-3: var(--c-ink-3);
  --c-danger:      #E8637A;
  --c-danger-weak: #FFEEF1;
  --c-success:      #5FA98C;
  --c-success-weak: #EFFAF5;
  --c-warning:      #D9A62E;
  --c-warning-weak: #FFFAEC;

  /* 描边 */
  --outline:      2.5px solid rgba(107, 79, 58, 0.45);
  --outline-sm:   2px solid rgba(107, 79, 58, 0.34);
  --outline-pink: 2.5px solid rgba(217, 108, 131, 0.42);
  --border:      var(--outline);
  --border-thin: var(--outline-sm);

  /* 柔和弥散阴影 */
  --shadow:    0 6px 0 rgba(217, 108, 131, 0.15), 0 12px 24px rgba(107, 79, 58, 0.08);
  --shadow-sm: 0 3px 0 rgba(217, 108, 131, 0.14), 0 7px 14px rgba(107, 79, 58, 0.06);
  --shadow-lg: 0 10px 0 rgba(217, 108, 131, 0.16), 0 24px 48px rgba(107, 79, 58, 0.16);

  /* 圆角 — 全局无硬直角 */
  --radius:       24px;
  --radius-sm:    14px;
  --radius-lg:    28px;
  --radius-input: 16px;
  --radius-pill:  999px;

  /* 弹性动效 */
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --t-fast: 150ms;
  --t-mid:  220ms;

  /* 尺寸（锁定：JS 依此定位课表色块，勿改） */
  --row-h: 46px;
  --col-w: 100px;
  --axis-w: 56px;
  --grid-min-w: 760px;
  --topbar-h: 60px;
  --tabbar-h: 66px;
  --safe-b: env(safe-area-inset-bottom, 0px);

  --font: 'Baloo 2', 'M PLUS Rounded 1c', 'Quicksand', 'Noto Sans SC',
          'PingFang SC', 'Microsoft YaHei', sans-serif;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 15px;
  line-height: 1.7;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font);
  font-weight: 500;
  color: var(--c-ink);
  background-color: var(--c-bg);
  /* 极淡波点，透明度 ≤6%，干净透气不喧宾夺主 */
  background-image:
    radial-gradient(rgba(217, 108, 131, 0.055) 1.6px, transparent 1.7px),
    radial-gradient(rgba(107, 79, 58, 0.045) 1.6px, transparent 1.7px);
  background-size: 26px 26px;
  background-position: 0 0, 13px 13px;
  background-attachment: fixed;
  min-height: 100vh;
  overflow-x: hidden;
  letter-spacing: 0.01em;
}

button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font: inherit; color: inherit; font-weight: 500; }
a { color: var(--c-pink-deep); text-decoration: none; font-weight: 700; }
ul, ol { list-style: none; }

h1, h2, h3, h4 {
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.35;
}

svg { display: block; }
.ico { width: 20px; height: 20px; flex-shrink: 0; }

/* 装饰容器：让内部图标撑满 */
.hm-deco .ico, .es-deco .ico { width: 100%; height: 100%; }
#topbar .week-badge .ico { width: 14px; height: 14px; }
#topbar .btn .ico { width: 15px; height: 15px; }

::selection { background: var(--c-pink-soft); color: var(--c-ink); }

:focus-visible {
  outline: 3px solid rgba(217, 108, 131, 0.55);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* 滚动条也软化 */
* { scrollbar-width: thin; scrollbar-color: rgba(217,108,131,0.35) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: rgba(217, 108, 131, 0.32);
  border-radius: var(--radius-pill);
  border: 3px solid transparent;
  background-clip: content-box;
}

/* ============================================================
   MOTION
   ============================================================ */
@keyframes iconPop {
  0%   { transform: scale(0.5) translateY(5px); }
  60%  { transform: scale(1.18); }
  100% { transform: scale(1) translateY(0); }
}
@keyframes floaty {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-5px); }
}
@keyframes bounceIn {
  0%   { opacity: 0; transform: scale(0.9) translateY(14px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes fadeUp {
  0%   { opacity: 0; transform: translateY(10px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes twinkle {
  0%, 100% { opacity: 0.5; transform: scale(0.85) rotate(-6deg); }
  50%      { opacity: 1;   transform: scale(1.1) rotate(6deg); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
#app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  max-width: 1120px;
  margin: 0 auto;
  padding-bottom: var(--tabbar-h);
}

#topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 10px;
  height: var(--topbar-h);
  padding: 0 18px;
  background: linear-gradient(180deg, #FFEDF2 0%, #FFE0E9 100%);
  border-bottom: 2.5px solid rgba(217, 108, 131, 0.3);
  box-shadow: 0 4px 16px rgba(217, 108, 131, 0.1);
}
#topbar .brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 1.4rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--c-pink-deep);
  white-space: nowrap;
}
#topbar .brand .bow {
  width: 26px;
  height: 26px;
  animation: floaty 3.6s ease-in-out infinite;
}
#topbar .spacer { flex: 1; }
#topbar .week-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.82rem;
  font-weight: 700;
  padding: 5px 15px;
  border-radius: var(--radius-pill);
  background: var(--c-card);
  color: var(--c-ink);
  white-space: nowrap;
  border: var(--outline-sm);
  box-shadow: var(--shadow-sm);
}
#topbar .week-badge.is-holiday {
  background: var(--c-lemon-wash);
  border-color: rgba(217, 166, 46, 0.4);
  color: #8A6A1F;
}

/* ---------- 桌面页签：胶囊糖丸 ---------- */
#tabs {
  display: flex;
  gap: 8px;
  padding: 12px 18px;
  background: rgba(255, 255, 255, 0.55);
  border-bottom: 2px solid var(--c-line);
}
#tabs .tab {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 20px;
  min-height: 42px;
  border-radius: var(--radius-pill);
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--c-ink-3);
  background: var(--c-card);
  border: 2px solid transparent;
  box-shadow: 0 2px 0 rgba(217, 108, 131, 0.12);
  transition: transform var(--t-fast) var(--ease-bounce),
              background var(--t-fast) ease,
              color var(--t-fast) ease,
              box-shadow var(--t-fast) ease;
}
#tabs .tab .ico { width: 19px; height: 19px; }
#tabs .tab:hover { color: var(--c-pink-deep); transform: translateY(-2px); }
#tabs .tab:active { transform: scale(0.94); }
#tabs .tab.active {
  background: linear-gradient(180deg, #FFC6D3 0%, #FFAFC1 100%);
  color: #7E3E52;
  border-color: rgba(107, 79, 58, 0.28);
  box-shadow: 0 4px 0 rgba(217, 108, 131, 0.28), 0 9px 18px rgba(107, 79, 58, 0.09);
}
#tabs .tab.active .ico { animation: iconPop 340ms var(--ease-bounce); }

/* ---------- 移动底栏 ---------- */
#tabbar {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  gap: 4px;
  background: rgba(255, 255, 255, 0.98);
  border-top: 2.5px solid rgba(217, 108, 131, 0.26);
  border-radius: 26px 26px 0 0;
  box-shadow: 0 -6px 22px rgba(107, 79, 58, 0.09);
  padding: 7px 10px calc(7px + var(--safe-b));
}
#tabbar .tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 48px;
  padding: 6px 0;
  border-radius: 18px;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--c-ink-3);
  transition: transform var(--t-fast) var(--ease-bounce),
              background var(--t-fast) ease,
              color var(--t-fast) ease;
}
#tabbar .tab:active { transform: scale(0.94); }
#tabbar .tab.active { color: var(--c-pink-deep); background: var(--c-pink-wash); }
#tabbar .tab .tab-icon { display: flex; align-items: center; justify-content: center; }
#tabbar .tab .tab-icon .ico { width: 23px; height: 23px; }
#tabbar .tab.active .tab-icon .ico { animation: iconPop 340ms var(--ease-bounce); }

#view {
  flex: 1;
  padding: 18px;
  overflow-y: auto;
  animation: fadeUp 240ms ease-out;
}

/* ============================================================
   BUTTONS & CHIPS
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 9px 22px;
  min-height: 44px;
  min-width: 44px;
  border-radius: var(--radius-pill);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  background: var(--c-card);
  color: var(--c-ink);
  border: 2px solid rgba(107, 79, 58, 0.3);
  box-shadow: 0 4px 0 rgba(217, 108, 131, 0.16), 0 8px 16px rgba(107, 79, 58, 0.07);
  transition: transform var(--t-fast) var(--ease-bounce),
              box-shadow var(--t-fast) ease,
              background var(--t-fast) ease;
}
.btn .ico { width: 17px; height: 17px; }
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 0 rgba(217, 108, 131, 0.2), 0 12px 22px rgba(107, 79, 58, 0.1);
}
.btn:active {
  transform: scale(0.94);
  box-shadow: 0 1px 0 rgba(217, 108, 131, 0.2), 0 3px 8px rgba(107, 79, 58, 0.08);
}
.btn-primary {
  background: linear-gradient(180deg, #FFC1CF 0%, #FFAEC1 100%);
  color: #7E3B4F;
  border-color: rgba(107, 79, 58, 0.32);
}
.btn-primary:hover { background: linear-gradient(180deg, #FFCBDA 0%, #FFB7C9 100%); }
.btn-ghost { background: var(--c-card); color: var(--c-ink); }
.btn-ghost:hover { background: var(--c-pink-wash); }
.btn-danger {
  background: linear-gradient(180deg, #FFC3CB 0%, #FFAAB6 100%);
  color: #8E3242;
  border-color: rgba(107, 79, 58, 0.32);
}
.btn-danger:hover { background: linear-gradient(180deg, #FFCFD6 0%, #FFB4C0 100%); }
.btn-sm { padding: 6px 16px; font-size: 0.82rem; min-height: 38px; }
.btn:disabled {
  opacity: 0.42;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 16px;
  min-height: 36px;
  border-radius: var(--radius-pill);
  font-size: 0.82rem;
  font-weight: 700;
  background: var(--c-card);
  color: var(--c-ink-2);
  border: 2px solid rgba(107, 79, 58, 0.24);
  box-shadow: 0 2px 0 rgba(217, 108, 131, 0.12);
  cursor: pointer;
  white-space: nowrap;
  transition: transform var(--t-fast) var(--ease-bounce),
              background var(--t-fast) ease,
              color var(--t-fast) ease,
              border-color var(--t-fast) ease;
}
.chip:hover { transform: translateY(-2px); background: var(--c-pink-wash); }
.chip:active { transform: scale(0.94); }
.chip.active {
  background: linear-gradient(180deg, #FFC6D3 0%, #FFAFC1 100%);
  color: #7E3E52;
  border-color: rgba(107, 79, 58, 0.3);
}
.chip-dot {
  width: 10px;
  height: 10px;
  border-radius: var(--radius-pill);
  margin-right: 0;
  box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.85);
}

/* ============================================================
   CARDS
   ============================================================ */
.card {
  background: linear-gradient(180deg, #FFFFFF 0%, #FFFDFA 100%);
  border-radius: var(--radius-card, var(--radius));
  border: var(--outline);
  box-shadow: var(--shadow);
  padding: 18px;
  animation: fadeUp 240ms ease-out both;
}
.card-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1.06rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--c-ink);
  margin-bottom: 14px;
}
.card-title::before {
  content: '';
  width: 7px;
  height: 20px;
  border-radius: var(--radius-pill);
  background: linear-gradient(180deg, var(--c-pink) 0%, var(--c-pink-deep) 100%);
  margin-right: 2px;
  flex-shrink: 0;
}
.card-title .count {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--c-ink-3);
  margin-left: auto;
}

/* ============================================================
   HOME VIEW
   ============================================================ */
.hm-banner {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #FFD3DF 0%, #FFC0CF 45%, #FFD9C8 100%);
  color: #7E3E52;
  border-radius: var(--radius-lg);
  border: var(--outline);
  box-shadow: var(--shadow);
  padding: 24px 26px;
  margin-bottom: 18px;
  animation: fadeUp 260ms ease-out both;
}
.hm-banner .hm-deco {
  position: absolute;
  pointer-events: none;
  opacity: 0.55;
}
.hm-banner .hm-deco.d1 { top: 12px; right: 18px; width: 34px; height: 34px; animation: twinkle 3.2s ease-in-out infinite; }
.hm-banner .hm-deco.d2 { bottom: 10px; right: 62px; width: 22px; height: 22px; animation: floaty 4s ease-in-out infinite; }
.hm-banner .hm-deco.d3 { top: 18px; right: 108px; width: 18px; height: 18px; animation: twinkle 4.4s ease-in-out infinite 0.6s; }

.hm-banner .hm-date {
  font-size: 1.55rem;
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: 1.3;
}
.hm-banner .hm-week {
  font-size: 0.9rem;
  font-weight: 600;
  color: rgba(126, 62, 82, 0.78);
  margin-top: 2px;
}
.hm-banner .hm-progress { margin-top: 16px; position: relative; z-index: 1; }
.hm-banner .hm-progress-bar {
  height: 14px;
  background: rgba(255, 255, 255, 0.72);
  border-radius: var(--radius-pill);
  overflow: hidden;
  border: 2px solid rgba(255, 255, 255, 0.95);
  box-shadow: inset 0 1px 3px rgba(107, 79, 58, 0.12);
}
.hm-banner .hm-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #FFE9A8 0%, #FFD166 100%);
  border-radius: var(--radius-pill);
  transition: width 420ms var(--ease-bounce);
}
.hm-banner .hm-progress-text {
  font-size: 0.78rem;
  font-weight: 700;
  color: rgba(126, 62, 82, 0.76);
  margin-top: 7px;
}

.hm-cols { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; align-items: start; }
.hm-cols > div { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

/* 今日课程行 */
.course-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 15px;
  min-height: 44px;
  border-radius: var(--radius-input);
  margin-bottom: 9px;
  cursor: pointer;
  background: var(--c-card);
  border: var(--outline-sm);
  border-left: 6px solid var(--c-pink);
  box-shadow: var(--shadow-sm);
  transition: transform var(--t-fast) var(--ease-bounce),
              box-shadow var(--t-fast) ease,
              background var(--t-fast) ease;
}
.course-row:hover { transform: translateY(-2px); background: var(--c-pink-wash); box-shadow: var(--shadow); }
.course-row:active { transform: scale(0.985); }
.course-row.is-past { opacity: 0.48; }
.course-row.is-ongoing {
  border-left-color: var(--c-mint-deep);
  background: linear-gradient(90deg, var(--c-mint-wash) 0%, #FFFFFF 70%);
}
.course-row .cr-time {
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--c-ink-2);
  min-width: 104px;
}
.course-row .cr-name {
  flex: 1;
  min-width: 0;
  font-weight: 700;
  font-size: 0.94rem;
  letter-spacing: -0.01em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.course-row .cr-meta { font-size: 0.8rem; font-weight: 500; color: var(--c-ink-3); }
.course-row .cr-status {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 3px 12px;
  border-radius: var(--radius-pill);
  margin-left: 4px;
  border: 1.5px solid transparent;
  white-space: nowrap;
}
.course-row .cr-status.ongoing {
  background: var(--c-mint);
  color: #2F6B55;
  border-color: rgba(95, 169, 140, 0.4);
}
.course-row .cr-status.idle {
  background: var(--c-sky-wash);
  color: #4A7BA8;
  border-color: rgba(120, 168, 214, 0.35);
}
.course-row .cr-status.past {
  background: rgba(107, 79, 58, 0.09);
  color: var(--c-ink-3);
  border-color: rgba(107, 79, 58, 0.16);
}

/* 下一个安排 */
.next-card {
  background: linear-gradient(160deg, #FFFFFF 0%, var(--c-sky-wash) 100%);
}
.next-card .nc-title {
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.next-card .nc-time { font-size: 0.85rem; font-weight: 500; color: var(--c-ink-2); }
.next-card .nc-countdown {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--c-pink-deep);
  margin-top: 10px;
  line-height: 1.2;
}
.next-card .nc-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--c-pink-deep);
  cursor: pointer;
  margin-top: 10px;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
  background: var(--c-pink-wash);
  transition: transform var(--t-fast) var(--ease-bounce), background var(--t-fast) ease;
}
.next-card .nc-link:hover { transform: translateX(3px); background: var(--c-pink-soft); }
.next-card .nc-link .ico { width: 14px; height: 14px; }

/* 今日待办 */
.todo-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 2px dashed var(--c-line);
}
.todo-row:last-child { border-bottom: none; }
.todo-row .todo-check {
  width: 26px;
  height: 26px;
  border-radius: var(--radius-pill);
  border: 2.5px solid rgba(107, 79, 58, 0.34);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  background: var(--c-card);
  color: transparent;
  transition: transform var(--t-fast) var(--ease-bounce),
              background var(--t-fast) ease,
              border-color var(--t-fast) ease;
}
.todo-row .todo-check:hover { transform: scale(1.1); border-color: var(--c-pink-deep); }
.todo-row .todo-check:active { transform: scale(0.9); }
.todo-row .todo-check.done {
  background: linear-gradient(180deg, #C9EDDF 0%, var(--c-mint) 100%);
  border-color: rgba(95, 169, 140, 0.55);
  color: #2F6B55;
  animation: iconPop 320ms var(--ease-bounce);
}
.todo-row .todo-check .ico { width: 15px; height: 15px; }
.todo-row .todo-title {
  flex: 1;
  min-width: 0;
  font-size: 0.92rem;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.todo-row .todo-title.done { text-decoration: line-through; color: var(--c-ink-3); font-weight: 500; }
.todo-row .todo-time { font-size: 0.8rem; font-weight: 600; color: var(--c-ink-3); white-space: nowrap; }

.pill-cat {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 3px 12px;
  border-radius: var(--radius-pill);
  border: 1.5px solid rgba(107, 79, 58, 0.16);
  white-space: nowrap;
  flex-shrink: 0;
}
.todo-row .todo-cat, .ag-item .ag-cat {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 3px 12px;
  border-radius: var(--radius-pill);
  border: 1.5px solid rgba(107, 79, 58, 0.16);
  white-space: nowrap;
  flex-shrink: 0;
}

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 34px 16px;
  color: var(--c-ink-3);
  font-size: 0.92rem;
  font-weight: 600;
  line-height: 1.8;
}
.empty-state .es-deco {
  display: block;
  width: 54px;
  height: 54px;
  margin: 0 auto 10px;
  opacity: 0.62;
  animation: floaty 3.8s ease-in-out infinite;
}

/* ============================================================
   TIMETABLE VIEW
   ============================================================ */
.tt-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.tt-toolbar .tt-week-title {
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 0 8px;
  color: var(--c-ink);
}

.tt-fixed-strip {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  background: linear-gradient(90deg, var(--c-lemon-wash) 0%, #FFFDF6 100%);
  border-radius: var(--radius-input);
  padding: 12px 16px;
  margin-bottom: 14px;
  font-size: 0.85rem;
  font-weight: 600;
  line-height: 1.7;
  color: #8A6A1F;
  border: 2px solid rgba(217, 166, 46, 0.32);
  box-shadow: var(--shadow-sm);
}
.tt-fixed-strip .ico { width: 18px; height: 18px; margin-top: 3px; flex-shrink: 0; }

.tt-grid-wrap {
  overflow-x: auto;
  background: var(--c-card);
  border-radius: var(--radius);
  border: var(--outline);
  box-shadow: var(--shadow);
}
.tt-grid {
  display: grid;
  grid-template-columns: 56px repeat(7, 100px);
  min-width: 756px;
  position: relative;
}
.tt-axis-cell {
  height: var(--row-h);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--c-ink-3);
  border-bottom: 2px dashed rgba(107, 79, 58, 0.12);
  border-right: 2px solid rgba(217, 108, 131, 0.18);
  position: sticky;
  left: 0;
  background: var(--c-pink-wash);
  z-index: 2;
  line-height: 1.25;
}
.tt-day-head {
  height: var(--row-h);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 0.84rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--c-ink);
  border-bottom: 2.5px solid rgba(217, 108, 131, 0.28);
  border-right: 2px solid rgba(217, 108, 131, 0.14);
  background: var(--c-pink-wash);
  line-height: 1.25;
}
.tt-day-head:last-child { border-right: none; }
.tt-day-head.is-today {
  color: #7E3E52;
  background: linear-gradient(180deg, #FFDCE5 0%, #FFCBD8 100%);
}
.tt-day-head .dh-num { font-weight: 600; font-size: 0.7rem; opacity: 0.72; }

.tt-cell {
  height: var(--row-h);
  border-bottom: 2px dashed rgba(107, 79, 58, 0.1);
  border-right: 2px solid rgba(107, 79, 58, 0.06);
  position: relative;
  cursor: pointer;
  transition: background var(--t-fast) ease;
}
.tt-cell:last-child { border-right: none; }
.tt-cell:hover { background: var(--c-pink-wash); }
.tt-cell .cell-plus {
  display: none;
  position: absolute;
  top: 3px;
  right: 5px;
  width: 22px;
  height: 22px;
  border-radius: var(--radius-pill);
  background: var(--c-pink);
  color: #7E3E52;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 2px 5px rgba(107, 79, 58, 0.18);
  animation: iconPop 220ms var(--ease-bounce);
}
.tt-cell .cell-plus .ico { width: 12px; height: 12px; }
.tt-cell:hover .cell-plus { display: flex; }

/* 课表色块：马卡龙色 + 白色间隙 + 圆角 */
.tt-block {
  position: absolute;
  left: 2px;
  right: 2px;
  border-radius: 12px;
  padding: 5px 7px;
  font-size: 0.72rem;
  line-height: 1.35;
  color: #6B4F3A;
  overflow: hidden;
  cursor: pointer;
  z-index: 1;
  font-weight: 700;
  border: 2.5px solid #FFFFFF;
  box-shadow: 0 2px 6px rgba(107, 79, 58, 0.16);
  transition: transform var(--t-fast) var(--ease-bounce), box-shadow var(--t-fast) ease;
}
.tt-block:hover {
  transform: scale(1.035);
  box-shadow: 0 5px 14px rgba(107, 79, 58, 0.24);
  z-index: 3;
}
.tt-block:active { transform: scale(0.97); }
.tt-block .blk-name {
  font-weight: 800;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tt-block .blk-loc {
  font-size: 0.65rem;
  font-weight: 600;
  opacity: 0.72;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tt-nowline {
  position: absolute;
  left: 56px;
  right: 0;
  height: 3px;
  background: var(--c-strawberry);
  border-radius: var(--radius-pill);
  z-index: 5;
  pointer-events: none;
  box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.85);
}
.tt-nowline::before {
  content: '';
  position: absolute;
  left: -5px;
  top: -3.5px;
  width: 10px;
  height: 10px;
  border-radius: var(--radius-pill);
  background: var(--c-strawberry);
  border: 2px solid #FFFFFF;
}

/* ---------- 移动课表 ---------- */
.tt-mobile { display: none; }
.tt-daybar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 6px 2px 10px;
  margin-bottom: 8px;
  scrollbar-width: none;
}
.tt-daybar::-webkit-scrollbar { display: none; }
.tt-daybar .day-chip {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  padding: 7px 14px;
  min-width: 48px;
  min-height: 52px;
  border-radius: 18px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--c-ink-2);
  cursor: pointer;
  position: relative;
  background: var(--c-card);
  border: 2px solid rgba(107, 79, 58, 0.2);
  box-shadow: 0 3px 0 rgba(217, 108, 131, 0.13);
  transition: transform var(--t-fast) var(--ease-bounce),
              background var(--t-fast) ease,
              color var(--t-fast) ease;
}
.tt-daybar .day-chip:active { transform: scale(0.94); }
.tt-daybar .day-chip.active {
  background: linear-gradient(180deg, #FFC6D3 0%, #FFAFC1 100%);
  color: #7E3E52;
  border-color: rgba(107, 79, 58, 0.28);
}
.tt-daybar .day-chip .dc-num { font-size: 0.68rem; font-weight: 600; opacity: 0.75; }
.tt-daybar .day-chip .has-dot {
  position: absolute;
  bottom: 5px;
  width: 5px;
  height: 5px;
  border-radius: var(--radius-pill);
  background: var(--c-pink-deep);
}
.tt-daybar .day-chip.active .has-dot { background: #7E3E52; }

.tt-daylist .tl-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 2px dashed var(--c-line);
}
.tl-row .tl-time {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--c-ink-3);
  min-width: 88px;
  padding-top: 2px;
}
.tl-row .tl-body { flex: 1; min-width: 0; }
.tl-row .tl-name { font-weight: 800; font-size: 0.94rem; letter-spacing: -0.01em; }
.tl-row .tl-meta { font-size: 0.8rem; font-weight: 500; color: var(--c-ink-2); }
.tl-row .tl-bar {
  width: 6px;
  border-radius: var(--radius-pill);
  margin-right: 8px;
  flex-shrink: 0;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
}

.tl-freerow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 0;
  color: var(--c-ink-3);
  font-size: 0.82rem;
  font-weight: 600;
}
.tl-freerow .free-plus {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-pill);
  background: var(--c-pink-wash);
  color: var(--c-pink-deep);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 2px solid rgba(217, 108, 131, 0.35);
  transition: transform var(--t-fast) var(--ease-bounce), background var(--t-fast) ease;
}
.tl-freerow .free-plus .ico { width: 15px; height: 15px; }
.tl-freerow .free-plus:hover { transform: scale(1.12); background: var(--c-pink-soft); }
.tl-freerow .free-plus:active { transform: scale(0.92); }

/* ============================================================
   AGENDA VIEW
   ============================================================ */
.ag-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.ag-filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px;
  scrollbar-width: none;
}
.ag-filters::-webkit-scrollbar { display: none; }

.ag-group-head {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 0.88rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--c-pink-deep);
  padding: 14px 4px 9px;
  position: sticky;
  top: 0;
  background: linear-gradient(180deg, var(--c-bg) 72%, rgba(255, 249, 245, 0));
  z-index: 1;
}
.ag-group-head .ico { width: 16px; height: 16px; }
.ag-group-head .gh-count { font-weight: 600; color: var(--c-ink-3); font-size: 0.8rem; }

.ag-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 15px;
  min-height: 44px;
  background: linear-gradient(180deg, #FFFFFF 0%, #FFFDFA 100%);
  border-radius: var(--radius-input);
  margin-bottom: 9px;
  border: var(--outline-sm);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform var(--t-fast) var(--ease-bounce),
              box-shadow var(--t-fast) ease,
              background var(--t-fast) ease;
}
.ag-item:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.ag-item:active { transform: scale(0.985); }
.ag-item .ag-check {
  width: 27px;
  height: 27px;
  border-radius: var(--radius-pill);
  border: 2.5px solid rgba(107, 79, 58, 0.34);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
  background: var(--c-card);
  color: transparent;
  transition: transform var(--t-fast) var(--ease-bounce),
              background var(--t-fast) ease,
              border-color var(--t-fast) ease;
}
.ag-item .ag-check:hover { transform: scale(1.1); border-color: var(--c-pink-deep); }
.ag-item .ag-check:active { transform: scale(0.9); }
.ag-item .ag-check.done {
  background: linear-gradient(180deg, #C9EDDF 0%, var(--c-mint) 100%);
  border-color: rgba(95, 169, 140, 0.55);
  color: #2F6B55;
  animation: iconPop 320ms var(--ease-bounce);
}
.ag-item .ag-check .ico { width: 15px; height: 15px; }
.ag-item .ag-body { flex: 1; min-width: 0; }
.ag-item .ag-title {
  font-weight: 700;
  font-size: 0.94rem;
  letter-spacing: -0.01em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ag-item .ag-title.done { text-decoration: line-through; color: var(--c-ink-3); font-weight: 500; }
.ag-item .ag-meta { font-size: 0.8rem; font-weight: 500; color: var(--c-ink-3); margin-top: 1px; }
.ag-item .ag-meta.overdue { color: #C4505F; font-weight: 700; }

/* ---------- FAB ---------- */
#fab {
  display: none;
  position: fixed;
  bottom: calc(var(--tabbar-h) + var(--safe-b) + 16px);
  right: 18px;
  width: 58px;
  height: 58px;
  border-radius: var(--radius-pill);
  background: linear-gradient(180deg, #FFC1CF 0%, #FF9FB4 100%);
  color: #FFFFFF;
  border: 2.5px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 6px 0 rgba(217, 108, 131, 0.3), 0 12px 24px rgba(107, 79, 58, 0.18);
  align-items: center;
  justify-content: center;
  z-index: 90;
  cursor: pointer;
  transition: transform var(--t-fast) var(--ease-bounce), box-shadow var(--t-fast) ease;
}
#fab .ico { width: 26px; height: 26px; }
#fab:hover { transform: translateY(-3px) rotate(90deg); }
#fab:active { transform: scale(0.94); box-shadow: 0 2px 0 rgba(217,108,131,0.3), 0 5px 12px rgba(107,79,58,0.16); }

/* ============================================================
   MODAL
   ============================================================ */
#modalRoot {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
}
#modalRoot.open { display: flex; }
#modalRoot .modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(107, 79, 58, 0.34);
  animation: overlayIn 180ms ease-out;
}
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

#modalRoot .modal-card {
  position: relative;
  background: var(--c-card);
  border-radius: var(--radius-lg);
  border: var(--outline);
  box-shadow: var(--shadow-lg);
  width: min(460px, 92vw);
  max-height: 86vh;
  overflow-y: auto;
  margin: auto;
  z-index: 1;
  animation: bounceIn 260ms var(--ease-bounce);
}
#modalRoot .modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 20px 22px 4px;
}
#modalRoot .modal-header h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1.22rem;
  font-weight: 800;
  letter-spacing: -0.025em;
  color: var(--c-pink-deep);
}
#modalRoot .modal-header h3 .ico { width: 21px; height: 21px; }
#modalRoot .modal-close {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border-radius: var(--radius-pill);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--c-ink-2);
  cursor: pointer;
  border: 2px solid rgba(107, 79, 58, 0.22);
  background: var(--c-pink-wash);
  transition: transform var(--t-fast) var(--ease-bounce), background var(--t-fast) ease;
}
#modalRoot .modal-close .ico { width: 16px; height: 16px; }
#modalRoot .modal-close:hover { background: var(--c-pink-soft); transform: rotate(90deg); }
#modalRoot .modal-close:active { transform: scale(0.9); }
#modalRoot .modal-body { padding: 14px 22px 4px; line-height: 1.7; }
#modalRoot .modal-footer {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  padding: 16px 22px 22px;
}
#modalRoot .modal-footer.danger { justify-content: space-between; }
#modalRoot .modal-drag { display: none; }

/* 移动端：底部抽屉 */
@media (max-width: 719px) {
  #modalRoot .modal-card {
    width: 100%;
    max-height: 88vh;
    border-radius: 28px 28px 0 0;
    border-bottom: none;
    margin: auto 0 0 0;
  }
  #modalRoot .modal-drag {
    display: block;
    width: 46px;
    height: 5px;
    border-radius: var(--radius-pill);
    background: rgba(217, 108, 131, 0.32);
    margin: 11px auto 0;
  }
}

/* ============================================================
   FORM
   ============================================================ */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--c-ink-2);
  margin-bottom: 6px;
}
.form-label .req { color: var(--c-strawberry); }
.form-input {
  width: 100%;
  padding: 10px 15px;
  min-height: 44px;
  border: 2px solid rgba(107, 79, 58, 0.26);
  border-radius: var(--radius-input);
  font-size: 0.94rem;
  font-weight: 600;
  background: #FFFDFA;
  color: var(--c-ink);
  transition: border-color var(--t-fast) ease,
              box-shadow var(--t-fast) ease,
              background var(--t-fast) ease;
}
.form-input::placeholder { color: rgba(107, 79, 58, 0.36); font-weight: 500; }
.form-input:hover { border-color: rgba(217, 108, 131, 0.42); }
.form-input:focus {
  outline: none;
  background: #FFFFFF;
  border-color: var(--c-pink-deep);
  box-shadow: 0 0 0 4px rgba(255, 183, 197, 0.34);
}
.form-input.error { border-color: var(--c-strawberry); box-shadow: 0 0 0 4px rgba(244, 112, 127, 0.18); }
.form-error { font-size: 0.78rem; font-weight: 600; color: #C4505F; margin-top: 5px; min-height: 0; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-textarea { resize: vertical; min-height: 72px; line-height: 1.7; }
select.form-input { cursor: pointer; }

.form-cats { display: flex; gap: 8px; flex-wrap: wrap; }
.form-cats .chip { font-size: 0.82rem; }

/* 课程时段行 */
.slot-row {
  display: grid;
  grid-template-columns: 62px 62px 74px 62px 62px 1fr 34px;
  gap: 7px;
  align-items: center;
  margin-bottom: 8px;
  font-size: 0.8rem;
  font-weight: 600;
}
.slot-row input, .slot-row select {
  padding: 6px 8px;
  min-height: 38px;
  border: 2px solid rgba(107, 79, 58, 0.24);
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: 600;
  background: #FFFDFA;
  transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease;
}
.slot-row input:focus, .slot-row select:focus {
  outline: none;
  border-color: var(--c-pink-deep);
  box-shadow: 0 0 0 3px rgba(255, 183, 197, 0.3);
}
.slot-row .slot-del {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-pill);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #C4505F;
  cursor: pointer;
  background: var(--c-straw-wash);
  border: 2px solid rgba(244, 112, 127, 0.35);
  transition: transform var(--t-fast) var(--ease-bounce), background var(--t-fast) ease;
}
.slot-row .slot-del .ico { width: 14px; height: 14px; }
.slot-row .slot-del:hover { transform: scale(1.1); background: #FFDDE3; }
.slot-row .slot-del:active { transform: scale(0.9); }

/* 备份面板 */
.bk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bk-stat {
  background: var(--c-pink-wash);
  border: 2px solid rgba(217, 108, 131, 0.28);
  border-radius: var(--radius-input);
  padding: 13px 15px;
}
.bk-stat .bk-k { font-size: 0.76rem; font-weight: 600; color: var(--c-ink-3); }
.bk-stat .bk-v { font-size: 1.02rem; font-weight: 800; letter-spacing: -0.02em; color: var(--c-ink); margin-top: 2px; }

/* 详情弹窗条目 */
.dt-line {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 9px 0;
  border-bottom: 2px dashed var(--c-line);
  font-size: 0.86rem;
  font-weight: 600;
  line-height: 1.6;
}
.dt-line:last-child { border-bottom: none; }
.dt-line .ico { width: 16px; height: 16px; margin-top: 4px; color: var(--c-pink-deep); flex-shrink: 0; }
.dt-sub {
  font-size: 0.84rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--c-ink-2);
  margin: 14px 0 6px;
}
.dt-swatch {
  display: inline-block;
  width: 14px;
  height: 14px;

}
.toast .ico { width: 18px; height: 18px; }

.toast.err { background: linear-gradient(180deg, #FFD9DF 0%, #FFC2CB 100%); color: #8E3242; }
@keyframes toastIn {
  0%   { opacity: 0; transform: translateY(16px) scale(0.9); }
  100% { opacity: 1; transform: translateY(0) scale(1); }

/* ============================================================
   UTILITIES
   ============================================================ */
var Util = {};

Util.esc = function(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
};

Util.parseISO = function(s) {
  var p = s.split('-');
  return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
};

Util.toISO = function(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dd;
};

Util.today = function() { return Util.toISO(new Date()); };

Util.addDays = function(iso, n) {
  var d = Util.parseISO(iso);
  d.setDate(d.getDate()+n);
  return Util.toISO(d);
};

Util.weekdayOf = function(iso) {
  var d = Util.parseISO(iso);
  var w = d.getDay();
  return w === 0 ? 7 : w;
};

Util.weekOf = function(iso) {
  var start = Util.parseISO(CONST.SEMESTER_START);
  var d = Util.parseISO(iso);
  var diff = Math.floor((d - start) / 86400000);
  if (diff < 0) return null;
  var w = Math.floor(diff / 7) + 1;
  return w > CONST.TOTAL_WEEKS ? null : w;
};

Util.weekStart = function(iso) {
  var d = Util.parseISO(iso);
  var w = d.getDay();
  var diff = w === 0 ? 6 : w - 1;
  d.setDate(d.getDate() - diff);
  return Util.toISO(d);
};

Util.weekEnd = function(iso) { return Util.addDays(Util.weekStart(iso), 6); };

Util.dateOf = function(week, weekday) {
  var start = Util.parseISO(CONST.SEMESTER_START);
  start.setDate(start.getDate() + (week-1)*7 + (weekday-1));
  return Util.toISO(start);
};

Util.periodTime = function(ps, pe) {
  return CONST.PERIODS[ps][0] + '-' + CONST.PERIODS[pe][1];
};

Util.nowHM = function() {
  var d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
};

Util.fmtCN = function(iso) {
  var d = Util.parseISO(iso);
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+CONST.WEEKDAY_LABELS[Util.weekdayOf(iso)-1];
};

Util.uid = function(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6); };

/* ============================================================
   STORE
   ============================================================ */
var Store = {};

Store.load = function() {
  try {
    var raw = localStorage.getItem(CONST.STORAGE_KEY);
    if (!raw) return Store.seed();
    var data = JSON.parse(raw);
    if (!data || !Array.isArray(data.courses) || !Array.isArray(data.events)) {
      return Store.seed();
    }
    if (Store.migrateColors(data)) Store.save(data);
    return data;
  } catch(e) { return Store.seed(); }
};

Store.migrateColors = function(data) {
  var changed = false;
  data.courses.forEach(function(c) {
    var i = CONST.LEGACY_COLORS.indexOf((c.color || '').toUpperCase());
    if (i >= 0) { c.color = CONST.COURSE_COLORS[i]; changed = true; }
  });
  return changed;
};

Store.save = function(data) {
  localStorage.setItem(CONST.STORAGE_KEY, JSON.stringify(data));
};

Store.seed = function() {
  var data = {
    courses: JSON.parse(JSON.stringify(CONST.SEED_COURSES)),
    events: [],
    settings: { semesterStart: CONST.SEMESTER_START, totalWeeks: CONST.TOTAL_WEEKS, schemaVersion: CONST.SCHEMA_VERSION }
  };
  Store.save(data);
  return data;
};

Store.clear = function() { localStorage.removeItem(CONST.STORAGE_KEY); };

Store.usage = function(data) {
  return new Blob([JSON.stringify(data)]).size;
};

Store.validate = function(obj) {
  var errors = [];
  if (!obj || typeof obj !== 'object') return ['不是有效对象'];
  if (!Array.isArray(obj.courses)) errors.push('缺少 courses 数组');
  if (!Array.isArray(obj.events)) errors.push('缺少 events 数组');
  if (obj.courses) {
    obj.courses.forEach(function(c, i) {
      if (!c.name) errors.push('课程['+i+']缺少名称');
      if (!Array.isArray(c.slots)) errors.push('课程['+i+']缺少 slots');
    });
  }
  if (obj.events) {
    obj.events.forEach(function(e, i) {
      if (!e.title) errors.push('日程['+i+']缺少标题');
      if (!e.date) errors.push('日程['+i+']缺少日期');
    });
  }
  return errors;
};

/* ============================================================
   SCHEDULE (pure functions)
   ============================================================ */
var Schedule = {};

Schedule.courseBlocksForWeek = function(courses, week) {
  var blocks = [];
  courses.forEach(function(course) {
    course.slots.forEach(function(slot) {
      if (slot.weekStart <= week && week <= slot.weekEnd) {
        blocks.push({
          courseId: course.id,
          course: course,
          weekday: slot.weekday,
          periodStart: slot.periodStart,
          periodEnd: slot.periodEnd,
          location: slot.location || '',
          weekStart: slot.weekStart,
          weekEnd: slot.weekEnd
        });
      }
    });
  });
  // Merge adjacent periods for same course+weekRange+weekday
  var merged = [];
  var groups = {};
  blocks.forEach(function(b) {
    var key = b.courseId+'|'+b.weekStart+'-'+b.weekEnd+'|'+b.weekday;
    if (!groups[key]) groups[key] = [];
    groups[key].push(b);
  });
  Object.keys(groups).forEach(function(key) {
    var grp = groups[key].sort(function(a,b){ return a.periodStart - b.periodStart; });
    var cur = Object.assign({}, grp[0]);
    for (var i = 1; i < grp.length; i++) {
      if (grp[i].periodStart === cur.periodEnd + 1) {
        cur.periodEnd = grp[i].periodEnd;
      } else {
        merged.push(cur);
        cur = Object.assign({}, grp[i]);
      }
    }
    merged.push(cur);
  });
  return merged;
};

Schedule.blocksOnDate = function(blocks, iso) {
  var wd = Util.weekdayOf(iso);
  return blocks.filter(function(b){ return b.weekday === wd; });
};

Schedule.blockState = function(block, nowISO, nowHM) {
  var today = nowISO;
  var blockDate = Util.dateOf(
    Schedule._blockWeek(block, today), block.weekday
  );
  if (blockDate < today) return 'past';
  if (blockDate > today) return 'future';
  var bt = Util.periodTime(block.periodStart, block.periodEnd);
  var bStart = bt.split('-')[0];
  var bEnd = bt.split('-')[1];
  if (nowHM >= bStart && nowHM <= bEnd) return 'ongoing';
  if (nowHM > bEnd) return 'past';
  return 'future';
};

Schedule._blockWeek = function(block, todayISO) {
  var tw = Util.weekOf(todayISO);
  if (tw && block.weekStart <= tw && tw <= block.weekEnd) return tw;
  return block.weekStart;
};

Schedule.todayCourses = function(courses, nowISO, nowHM) {
  var week = Util.weekOf(nowISO);
  if (!week) return [];
  var blocks = Schedule.courseBlocksForWeek(courses, week);
  var dayBlocks = Schedule.blocksOnDate(blocks, nowISO);
  return dayBlocks.map(function(b) {
    return Object.assign({}, b, { state: Schedule.blockState(b, nowISO, nowHM) });
  }).sort(function(a,b){ return a.periodStart - b.periodStart; });
};

Schedule.nextUp = function(courses, events, nowISO, nowHM) {
  var candidates = [];
  var week = Util.weekOf(nowISO);
  if (week) {
    var blocks = Schedule.courseBlocksForWeek(courses, week);
    blocks.forEach(function(b) {
      var bd = Util.dateOf(Schedule._blockWeek(b, nowISO), b.weekday);
      var bt = Util.periodTime(b.periodStart, b.periodEnd);
      if (bd > nowISO || (bd === nowISO && bt.split('-')[0] > nowHM)) {
        candidates.push({ kind:'course', at: bd+'T'+bt.split('-')[0], title: b.course.name, location: b.location, date: bd, time: bt.split('-')[0] });
      }
    });
  }
  events.forEach(function(ev) {
    if (ev.done) return;
    var t = ev.startTime || '00:00';
    if (ev.date > nowISO || (ev.date === nowISO && t > nowHM)) {
      candidates.push({ kind:'event', at: ev.date+'T'+t, title: ev.title, location: ev.location, date: ev.date, time: t });
    }
  });
  candidates.sort(function(a,b){ return a.at < b.at ? -1 : 1; });
  return candidates.length ? candidates[0] : null;
};

Schedule.noTimeCourses = function(courses) {
  return courses.filter(function(c){ return c.slots.length === 0; });
};

Schedule.slotLabel = function(slot) {
  return slot.weekStart+'-'+slot.weekEnd+'周 · '+CONST.WEEKDAY_LABELS[slot.weekday-1]+' · '+slot.periodStart+'-'+slot.periodEnd+'节 · '+Util.periodTime(slot.periodStart, slot.periodEnd)+(slot.location ? ' · '+slot.location : '');
};

/* ============================================================
   EVENTS
   ============================================================ */
var Events = {};

Events.list = function(data) { return data.events; };

Events.get = function(data, id) { return data.events.find(function(e){ return e.id === id; }); };

Events.create = function(data, draft) {
  var ev = Object.assign({
    id: Util.uid('e'),
    done: false,
    createdAt: Date.now()
  }, draft);
  data.events.push(ev);
  Store.save(data);
  return ev;
};

Events.update = function(data, id, patch) {
  var ev = Events.get(data, id);
  if (ev) {
    Object.assign(ev, patch);
    Store.save(data);
  }
  return ev;
};

Events.remove = function(data, id) {
  data.events = data.events.filter(function(e){ return e.id !== id; });
  Store.save(data);
};

Events.toggle = function(data, id) {
  var ev = Events.get(data, id);
  if (ev) { ev.done = !ev.done; Store.save(data); }
  return ev;
};

Events.filterBy = function(events, kind, nowISO) {
  if (kind === 'all') return events.filter(function(e){ return !e.done; });
  if (kind === 'done') return events.filter(function(e){ return e.done; });
  if (kind === 'today') return events.filter(function(e){ return e.date === nowISO && !e.done; });
  if (kind === 'week') {
    var ws = Util.weekStart(nowISO);
    var we = Util.weekEnd(nowISO);
    return events.filter(function(e){ return e.date >= ws && e.date <= we && !e.done; });
  }
  return events;
};

Events.groupByDate = function(events, nowISO) {
  var groups = {};
  var order = [];
  events.forEach(function(ev) {
    var key = ev.date;
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(ev);
  });
  order.sort();
  var nowWeek = Util.weekOf(nowISO);
  return order.map(function(date) {
    var w = Util.weekOf(date);
    var title;
    if (date === nowISO) title = '今天 · '+Util.fmtCN(date)+(w ? ' · 第'+w+'周' : '');
    else if (date === Util.addDays(nowISO, 1)) title = '明天 · '+Util.fmtCN(date)+(w ? ' · 第'+w+'周' : '');
    else {
      var ws = Util.weekStart(date);
      var we = Util.weekEnd(date);
      var nws = Util.weekStart(Util.addDays(nowISO, 7));
      if (ws === nws) title = '下周 · '+Util.fmtCN(ws)+'~'+Util.fmtCN(we)+(w ? ' · 第'+w+'周' : '');
      else title = Util.fmtCN(ws)+'~'+Util.fmtCN(we)+(w ? ' · 第'+w+'周' : '');
    }
    return { key: date, title: title, items: groups[date] };
  });
};

Events.sort = function(events) {
  return events.slice().sort(function(a,b) {
    var aHasTime = !!a.startTime;
    var bHasTime = !!b.startTime;
    if (aHasTime !== bHasTime) return aHasTime ? -1 : 1;
    if (aHasTime && bHasTime) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return a.startTime < b.startTime ? -1 : 1;
    }
    return a.date > b.date ? -1 : (a.date < b.date ? 1 : 0);
  });
};

Events.isOverdue = function(ev, nowISO) { return ev.date < nowISO && !ev.done; };

Events.stats = function(events) {
  var total = events.length;
  var done = events.filter(function(e){ return e.done; }).length;
  return { total: total, done: done };
};

/* ============================================================
   TOAST
   ============================================================ */
var Toast = {};

Toast.show = function(msg, kind) {
  kind = kind || 'ok';
  var root = document.getElementById('toastRoot');
  var el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = Icon(kind === 'err' ? 'alert' : 'check') + '<span></span>';
  el.lastChild.textContent = msg;
  root.appendChild(el);
  var dur = kind === 'err' ? 4000 : 2000;
  setTimeout(function() {
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px) scale(0.96)';
    el.style.transition = 'opacity 0.28s ease, transform 0.28s ease';
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 300);
  }, dur);
};

/* ============================================================
   MODAL
   ============================================================ */
var Modal = {};
Modal.stack = [];
Modal._scrollY = 0;

Modal.open = function(opts) {
  var root = document.getElementById('modalRoot');
  var card = document.getElementById('modalCard');
  Modal._scrollY = window.scrollY;
  document.body.style.overflow = 'hidden';
  root.classList.add('open');
  card.innerHTML = opts.html || '';
  Icon.hydrate(card);
  Modal.stack.push(opts);
  if (opts.onMount) opts.onMount(card);
};

Modal.close = function() {
  var opts = Modal.stack.pop();
  if (!Modal.stack.length) {
    document.getElementById('modalRoot').classList.remove('open');
    document.body.style.overflow = '';
    window.scrollTo(0, Modal._scrollY);
  } else {
    var prev = Modal.stack[Modal.stack.length-1];
    document.getElementById('modalCard').innerHTML = prev.html || '';
    Icon.hydrate(document.getElementById('modalCard'));
    if (prev.onMount) prev.onMount(document.getElementById('modalCard'));
  }
  if (opts && opts.onClose) opts.onClose();
};

Modal.closeAll = function() {
  while (Modal.stack.length) Modal.close();
};

Modal.confirm = function(opts) {
  var html = '<div class="modal-drag"></div>' +
    '<div class="modal-header"><h3><span data-icon="'+(opts.danger?'alert':'sparkle')+'"></span>'+Util.esc(opts.title||'确认')+'</h3><span class="modal-close" data-action="close"><span data-icon="close"></span></span></div>' +
    '<div class="modal-body"><p style="font-size:0.92rem;line-height:1.7;">'+Util.esc(opts.text||'')+'</p></div>' +
    '<div class="modal-footer'+(opts.danger?' danger':'')+'">' +
    (opts.danger ? '<button class="btn btn-danger btn-sm" data-action="confirm-del"><span data-icon="trash"></span>确认删除</button>' : '') +
    '<span class="spacer" style="flex:1"></span>' +
    '<button class="btn btn-ghost btn-sm" data-action="cancel">取消</button>' +
    (!opts.danger ? '<button class="btn btn-primary btn-sm" data-action="confirm"><span data-icon="check"></span>确认</button>' : '') +
    '</div>';
  Modal.open({
    html: html,
    onMount: function(card) {
      card.querySelector('[data-action="close"]').onclick = Modal.close;
      card.querySelector('[data-action="cancel"]').onclick = Modal.close;
      var confirmBtn = card.querySelector('[data-action="confirm"]') || card.querySelector('[data-action="confirm-del"]');
      if (confirmBtn) confirmBtn.onclick = function() { Modal.close(); if(opts.onConfirm) opts.onConfirm(); };

            weekStart: parseInt(row.querySelector('.slot-ws').value)||1,
            weekEnd: parseInt(row.querySelector('.slot-we').value)||1,
            weekday: parseInt(row.querySelector('.slot-wd').value)||1,
            periodStart: parseInt(row.querySelector('.slot-ps').value)||1,
            periodEnd: parseInt(row.querySelector('.slot-pe').value)||1,
            location: row.querySelector('.slot-loc').value.trim()
          });
        });
        course.name = name;
        course.teacher = card.querySelector('#fc-teacher').value.trim();
        course.campus = card.querySelector('#fc-campus').value.trim();
        course.mode = card.querySelector('#fc-mode').value.trim();
        course.color = selColor;
        course.slots = slots;
        Store.save(data);
        Toast.show('已保存');
        Modal.close();
        App.render();
      };

      card.querySelector('[data-action="del-course"]').onclick = function() {
        Modal.confirm({
          title: '确认删除课程',
          text: '删除"'+course.name+'"？此操作不可恢复。',
          danger: true,
          onConfirm: function() {
            data.courses = data.courses.filter(function(c){ return c.id !== courseId; });
            Store.save(data);
            Toast.show('已删除');
            Modal.close();
            App.render();
          }
        });
      };
    }
  });
};

var Backup = {};

Backup.open = function(data) {
  var usage = Store.usage(data);
  var kb = (usage/1024).toFixed(1);
  var html = '<div class="modal-drag"></div>' +
    '<div class="modal-header"><h3><span data-icon="download"></span>数据备份</h3><span class="modal-close" data-action="close"><span data-icon="close"></span></span></div>' +
    '<div class="modal-body">' +
    '<div class="bk-grid" style="margin-bottom:16px;">' +
    '<div class="bk-stat"><div class="bk-k">当前存储</div><div class="bk-v">'+kb+' KB</div></div>' +
    '<div class="bk-stat"><div class="bk-k">课程 / 日程</div><div class="bk-v">'+data.courses.length+' 门 · '+data.events.length+' 条</div></div>' +
    '</div>' +
    '<div class="bk-grid">' +
    '<button class="btn btn-ghost" id="bk-export"><span data-icon="download"></span>导出 JSON</button>' +
    '<button class="btn btn-ghost" id="bk-import"><span data-icon="upload"></span>导入 JSON</button>' +
    '<button class="btn btn-ghost" id="bk-restore"><span data-icon="restore"></span>恢复预置课表</button>' +
    '<button class="btn btn-ghost" id="bk-clear" style="color:#C4505F;border-color:rgba(244,112,127,0.4);background:var(--c-straw-wash);"><span data-icon="trash"></span>清空全部数据</button>' +
    '</div>' +
    '<input type="file" id="bk-file" accept=".json" style="display:none">' +
    '</div>';

  Modal.open({
    html: html,
    onMount: function(card) {
      card.querySelector('[data-action="close"]').onclick = Modal.close;

      card.querySelector('#bk-export').onclick = function() {
        var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'schedule-backup-'+Util.today()+'.json';
        a.click();
        URL.revokeObjectURL(a.href);
        Toast.show('已导出');
      };

      card.querySelector('#bk-import').onclick = function() { card.querySelector('#bk-file').click(); };
      card.querySelector('#bk-file').onchange = function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function() {
          try {
            var imported = JSON.parse(reader.result);
            var errors = Store.validate(imported);
            if (errors.length) { Toast.show('文件格式不正确: '+errors[0], 'err'); return; }
            Modal.confirm({
              title: '确认导入',
              text: '导入将覆盖当前全部数据，确定继续？',
              onConfirm: function() {
                data.courses = imported.courses;
                data.events = imported.events;
                Store.save(data);
                Toast.show('导入成功');
                Modal.close();
                App.render();
              }
            });
          } catch(e) { Toast.show('文件格式不正确', 'err'); }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      card.querySelector('#bk-restore').onclick = function() {
        Modal.confirm({
          title: '恢复预置课表',
          text: '将重置课程为预置的 4 门课程，日程数据保留。确定？',
          onConfirm: function() {
            data.courses = JSON.parse(JSON.stringify(CONST.SEED_COURSES));
            Store.save(data);
            Toast.show('已恢复预置课表');
            Modal.close();
            App.render();
          }
        });
      };

      card.querySelector('#bk-clear').onclick = function() {
        Modal.confirm({
          title: '清空全部数据',
          text: '将删除所有课程和日程，此操作不可恢复。确定？',
          danger: true,
          onConfirm: function() {
            data.courses = [];
            data.events = [];
            Store.save(data);
            Toast.show('已清空');
            Modal.close();
            App.render();
          }
        });
      };
    }
  });
};
